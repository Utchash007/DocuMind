<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar — DocuMind</title>
<style>
  :root {
    --light: #F1F6F9;
    --slate: #394867;
    --navy: #212A3E;
    --bluegray: #9BA4B5;
    --text: #212A3E;
    --muted: #5f6b85;
    --border: #e1e6ee;
    --active-bg: #e3e9f2;
    --hover-bg: #eceff5;
    --panel-shadow:
      0 1px 2px rgba(33, 42, 62, 0.06),
      0 12px 32px -12px rgba(57, 72, 103, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--light) 0%, #e4ebf3 100%);
    min-height: 100vh;
    color: var(--text);
  }

  .sidebar {
    position: fixed;
    top: 24px;
    left: 24px;
    bottom: 24px;
    width: 264px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--panel-shadow);
    display: flex;
    flex-direction: column;
    padding: 20px 14px 16px;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 8px 4px;
  }

  .brand__icon {
    width: 40px;
    height: 40px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--slate) 0%, var(--navy) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -3px rgba(33, 42, 62, 0.5);
  }

  .brand__icon svg { width: 20px; height: 20px; stroke: #fff; }

  .brand__name {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 14px 10px;
  }

  .nav { display: flex; flex-direction: column; }

  .nav__group { display: flex; flex-direction: column; gap: 4px; }

  .nav__item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 0.925rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .nav__item svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    flex-shrink: 0;
  }

  .nav__item:hover {
    background: var(--hover-bg);
    color: var(--navy);
  }

  .nav__item.is-active {
    background: var(--active-bg);
    color: var(--navy);
    font-weight: 600;
  }

  .nav__item.is-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 22px;
    border-radius: 999px;
    background: var(--slate);
  }

  .bottom { margin-top: auto; }

  .bottom .divider { margin: 0 4px 14px; }

  .profile { padding: 0 6px 2px; }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--active-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--slate);
  }

  .profile__row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .profile__name {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
  }

  .profile__btn {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 10px;
    background: transparent;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .profile__btn:hover {
    background: var(--hover-bg);
    color: var(--navy);
  }

  .profile__btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
  }

  .main {
    margin: 24px 24px 24px 312px;
    min-height: calc(100vh - 48px);
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .main__label {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--bluegray);
    opacity: 0.7;
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand__icon">
        <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M12 10.8c.42 1.66 1.44 2.68 3.1 3.1-1.66.42-2.68 1.44-3.1 3.1-.42-1.66-1.44-2.68-3.1-3.1 1.66-.42 2.68-1.44 3.1-3.1z"/>
        </svg>
      </div>
      <div class="brand__name">DocuMind</div>
    </div>

    <div class="divider"></div>

    <nav class="nav">
      <div class="nav__group">
        <a class="nav__item is-active" href="#" aria-current="page">
          <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          Dashboard
        </a>
        <a class="nav__item" href="#">
          <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>
          Documents
        </a>
        <a class="nav__item" href="#">
          <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Chats
        </a>
      </div>

      <div class="divider"></div>

      <div class="nav__group">
        <a class="nav__item" href="#">
          <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
          Notes
        </a>
        <a class="nav__item" href="#">
          <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </a>
        <a class="nav__item" href="#">
          <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Help
        </a>
      </div>
    </nav>

    <div class="bottom">
      <div class="divider"></div>
      <div class="profile">
        <div class="avatar">UH</div>
        <div class="profile__row">
          <span class="profile__name">Utchash</span>
          <button type="button" class="profile__btn" aria-label="User settings">
            <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <span class="main__label">Main Content</span>
  </main>

</body>
</html>
