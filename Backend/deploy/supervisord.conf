[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
directory=/tmp

[program:backend]
command=/usr/local/bin/nr-entrypoint.sh python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/backend
priority=10
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/nr-entrypoint.sh python -m app.workers.pdf_worker
directory=/app/backend
priority=20
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node server.js
directory=/app/frontend
priority=30
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
