# Alembic configuration for NoteMind v2.
#
# The database URL is read from the environment by migrations/env.py:
#   DATABASE_URL       - application/migration database (default env)
#   TEST_DATABASE_URL  - dedicated PostgreSQL test database (-x environment=test)
# There is no URL in this file on purpose: a checked-in URL could silently
# point migrations at the wrong database.
#
# Typical commands (from Backend/):
#   alembic upgrade head
#   alembic -x environment=test upgrade head
#   alembic -x environment=test downgrade base
#   alembic upgrade head --sql        (offline SQL generation, no DB needed)

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally left empty; env.py supplies it.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
