; New Relic configuration for the DocuMind API and PDF worker.
;
; The license key is deliberately absent: provide NEW_RELIC_LICENSE_KEY in
; the environment. The container entrypoint only starts the agent when that
; variable is present, so a deployment without a license key runs normally.
;
; Environment variables override the values below, which keeps one image
; usable across environments.

[newrelic]
app_name = DocuMind Backend
monitor_mode = true

; Logs go to the container's stderr so `docker logs` shows them.
log_file = stderr
log_level = info

; FastAPI/Starlette transactions, uvicorn ASGI timing, psycopg queries,
; httpx calls to Chroma/Groq/Hugging Face and Appwrite Storage.
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5

error_collector.enabled = true
error_collector.expected_status_codes = 404 405 409 422

; One distributed trace per user request: the Next.js proxy and the browser
; both propagate the trace context.
distributed_tracing.enabled = true

; The API tier has no HTML views; browser monitoring belongs to the web tier.
browser_monitoring.auto_instrument = false

; Request/response bodies may contain user documents and are never captured.
attributes.enabled = true
